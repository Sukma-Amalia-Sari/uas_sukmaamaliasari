<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <title>SM Groups</title>

    <style>
      /* =========================
         GLOBAL & THEME
      ========================= */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        overflow-x: hidden;
      }

      :root {
        --bg-body: #1a001a;
        --text-main: #ffe6f7;
        --card-bg: #330033;
        --accent: #ff008c;
        --accent-glow: #ff4db8;
      }

      body.light-theme {
        --bg-body: #ffffff;
        --text-main: #1a001a;
        --card-bg: #fafafa;
        --accent: #8f3fff;
        --accent-glow: #b58bff;
      }

      body {
        background: var(--bg-body);
        color: var(--text-main);
        font-family: "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
        transition: 0.3s;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      header {
        background: var(--accent);
        padding: 20px;
        color: white;
        box-shadow: 0 0 15px var(--accent-glow);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      header img {
        width: 130px;
        margin-right: 17px;
      }

      header .title {
        font-size: 40px;
        font-weight: 600;
      }

      nav {
        display: flex;
        justify-content: center;
        gap: 80px;
        background: var(--card-bg);
        padding: 18px;
        font-size: 18px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.25);
      }

      nav a:hover {
        color: #ff66c4;
      }

      .groups-wrapper {
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 20px;
      }

      .groups-wrapper h1 {
        text-align: center;
        margin-bottom: 35px;
        font-size: 34px;
      }

      .groups-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
      }

      .group-card {
        background: var(--card-bg);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.35);
        transition: transform 0.35s ease, box-shadow 0.35s ease;
        text-align: center;
      }

      .group-card:hover {
        transform: scale(1.06);
        box-shadow: 0 0 25px var(--accent-glow);
      }

      .group-card img {
        width: 100%;
        height: 260px;
        object-fit: cover;
        display: block;
      }

      .group-card h3 {
        margin: 14px 0 18px;
        font-size: 20px;
        font-weight: 600;
      }

      @media (max-width: 900px) {
        nav {
          flex-wrap: wrap;
          gap: 15px;
        }

        nav a {
          width: 30%;
          text-align: center;
        }

        header {
          flex-wrap: wrap;
          text-align: center;
        }

        header .title {
          width: 100%;
          font-size: 34px;
          margin-top: 10px;
        }

        .groups-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 600px) {
        nav {
          flex-direction: column;
          align-items: center;
        }

        nav a {
          width: 100%;
        }

        header .title {
          font-size: 26px;
        }

        .groups-grid {
          grid-template-columns: 1fr;
        }

        .group-card img {
          height: 230px;
        }
      }
      footer {
        background: var(--accent);
        text-align: center;
        padding: 20px;
        margin-top: 30px;
        color: white;
        box-shadow: 0 0 15px var(--accent-glow);
        font-family: Georgia, "Times New Roman", Times, serif;
      }
    </style>
  </head>
