<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SM Gallery</title>

    <style>
      /* ==========================
         GLOBAL THEME 
      ========================== */
      :root {
        --bg-body: #1a001a;
        --text-main: #ffe6f7;
        --card-bg: #330033;
        --accent: #ff008c;
        --accent-glow: #ff4db8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", Times, serif;
        background: var(--bg-body);
        color: var(--text-main);
        transition: background 0.3s, color 0.3s;
        overflow-x: hidden;
      }

      body.light-theme {
        --bg-body: #ffffff;
        --text-main: #1a001a;
        --card-bg: #fafafa;
        --accent: #8f3fff;
        --accent-glow: #b58bff;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      header {
        background: var(--accent);
        padding: 20px;
        color: white;
        box-shadow: 0 0 15px var(--accent-glow);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
      }

      header img {
        width: 130px;
        margin-right: 17px;
      }

      header .title {
        font-size: 40px;
        font-weight: 600;
      }

      nav {
        display: flex;
        justify-content: center;
        gap: 80px;
        background: var(--card-bg);
        padding: 18px;
        font-size: 18px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.25);
        font-family: "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
      }

      nav a:hover {
        color: #ff66c4;
      }

      .gallery-wrapper {
        max-width: 1100px;
        margin: 40px auto;
        padding: 30px;
        background: var(--card-bg);
        border-radius: 14px;
        box-shadow: 0 0 14px rgba(0, 0, 0, 0.35);
      }

      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
      }

      .gallery-card {
        position: relative;
        width: 100%;
        border-radius: 14px;
        overflow: hidden;
        background: #000;
        cursor: pointer;
        transition: transform 0.35s ease, box-shadow 0.35s ease;
      }

      .gallery-card:hover {
        transform: scale(1.08);
        box-shadow: 0 0 25px var(--accent-glow);
        z-index: 3;
      }

      .gallery-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.35s ease;
      }

      .h-sm {
        height: 180px;
      }
      .h-md {
        height: 260px;
      }
      .h-lg {
        height: 340px;
      }

      @media (max-width: 900px) {
        nav {
          flex-wrap: wrap;
          gap: 15px;
        }

        nav a {
          width: 30%;
          text-align: center;
        }

        header {
          flex-wrap: wrap;
          text-align: center;
        }

        header .title {
          width: 100%;
          font-size: 36px;
          margin-top: 10px;
        }

        .gallery-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .gallery-wrapper {
          margin: 25px 15px;
          padding: 20px;
        }
      }

      @media (max-width: 600px) {
        nav {
          flex-direction: column;
          align-items: center;
        }

        nav a {
          width: 100%;
        }

        header .title {
          font-size: 26px;
        }

        .gallery-grid {
          grid-template-columns: 1fr;
        }
      }

      footer {
        background: var(--accent);
        text-align: center;
        padding: 20px;
        margin-top: 40px;
        color: white;
        box-shadow: 0 0 15px var(--accent-glow);
      }
    </style>
  </head>

  <body>
